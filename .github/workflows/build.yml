name: Build Hermes AI Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Send APK to Telegram
        if: success() && github.ref == 'refs/heads/main'
        env:
          TELEGRAM_BOT_TOKEN: "8707220549:AAHrnzfjPQFG4FjjLp90lRMDETm0vIUSZzr8"
          TELEGRAM_CHAT_ID: "161962864"
          APK_PATH: "app/build/outputs/apk/debug/app-debug.apk"
        run: |
          curl -s -k --connect-timeout 30 \
            -F "chat_id=$TELEGRAM_CHAT_ID" \
            -F "document=@$APK_PATH" \
            -F "caption=Hermes AI v1.0.0 - build ${{ github.run_number }}" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" || \
            echo "Telegram notification skipped (network issue)"
